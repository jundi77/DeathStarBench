name: frontend

ports:
  - port: 5000
    targetPort: 5000

ingress:
  className: nginx
  hosts:
    - host: hotel-reservation.127.0.0.1.sslip.io
      paths:
        - path: /
          type: Prefix
          port: 5000

container:
  command: frontend
  image: deathstarbench/hotel-reservation
  name: hotel-reserv-frontend
  ports:
  - containerPort: 5000

configMaps:
  - name: service-config.json
    mountPath: config.json
    value: service-config
